[package]
name = "subsystem-integration-manager"
version = "0.1.0"
description = "Promotes approved subsystem commits into a main-system branch."
authors = ["VOS Integration"]
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"

[lib]
name = "subsystem_integration_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Date handling for fixture timestamps and relative-time rendering only.
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
