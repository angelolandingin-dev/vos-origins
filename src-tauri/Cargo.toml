[package]
name = "vos-origins"
version = "0.1.1"
description = "Promotes approved subsystem commits into a main-system branch."
authors = ["VOS Integration"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "vos_origins_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Date handling for fixture timestamps and relative-time rendering only.
chrono = "0.4"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
