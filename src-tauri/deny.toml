# cargo-deny configuration — supply-chain policy (licenses / advisories / bans).
# Run via `npm run deny` (requires `cargo install cargo-deny`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# chrono is only used for fixture timestamps and relative-time rendering; the
# advisory reports the crate as unmaintained, not a vulnerability, and there is
# no upgrade path inside chrono. Migration to jiff/time is tracked separately.
ignore = [
  "RUSTSEC-2026-0543",
  # Unmaintained-only advisories from the Tauri dependency tree: proc-macro-error
  # is build-time only, and the zvariant/zbus_names family reaches us through
  # tauri-plugin-opener on Linux, which this Windows-only app never ships.
  "RUSTSEC-2024-0370",
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
version = 2
# This crate is not published (publish = false), so it carries no SPDX license.
private = { ignore = true }
# Allow only common permissive licenses; anything else must be explicitly reviewed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
