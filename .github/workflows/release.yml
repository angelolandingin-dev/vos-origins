name: Release

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The updater refuses unsigned artifacts, so the private key is mandatory here.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'VOS Origins v__VERSION__'
          releaseBody: 'Windows installers plus the signed update bundle. Existing installs update themselves from Settings › Updates.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: '--target x86_64-pc-windows-msvc'
